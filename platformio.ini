; ThermoTrace — nodo edge ESP32
;
; Dos entornos:
;   esp32dev → firmware real (compilación cruzada, requiere el core Arduino)
;   native   → pruebas unitarias de la lógica portable en la máquina de CI
;
; La separación existe porque la capa IoT no tenía ni una sola prueba
; automatizada: el CI solo comprobaba que el binario enlazaba. Todo lo que se
; puede verificar sin hardware —contrato del payload, orden FIFO del buffer,
; antirrebote, backoff, rangos de sensores— vive ahora en `src/core/`, no
; depende de Arduino y se ejecuta en cada push.

[platformio]
default_envs = esp32dev

; =========================================================================
; Firmware — ESP32 DevKitC V4
; =========================================================================
[env:esp32dev]
; Versión FIJADA. Sin ella, `platform = espressif32` resuelve a la última
; publicada y dos compilaciones en fechas distintas pueden usar cores de
; Arduino distintos: el binario que se defiende no sería el que se compiló.
; 7.0.1 = Arduino core 2.0.17 sobre ESP-IDF 4.4, que es la rama del TWDT
; implementada y verificada en `system/Watchdog.cpp`.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ===================== Librerías =====================
; ArduinoJson ya no aparece: el payload se serializa en `core/PayloadCore.cpp`
; con `std::string`. Son ocho campos planos de tipo fijo, así que un
; `JsonDocument` en el heap por cada lectura solo aportaba fragmentación de RAM
; en un proceso que corre semanas, y una dependencia que impedía compilar y
; probar el contrato con el backend fuera del ESP32.
; `256dpi/MQTT` (arduino-mqtt, sobre lwmqtt) sustituye a PubSubClient: es la
; que permite publicar en QoS 1 esperando el PUBACK real del broker, que es lo
; que exige HU-11. PubSubClient solo publica en QoS 0. Ver MQTTManager.h.
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.0
    adafruit/Adafruit BusIO @ ^1.14.0
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    256dpi/MQTT @ ^2.5.2

; ===================== Flags de compilación =====================
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

; ===================== Particiones =====================
; 4MB Flash: 1216KB app0, 1216KB app1 (OTA), 1600KB LittleFS, 20KB NVS.
;
; Tabla propia y NO `default_ffat.csv`: aquella no define ninguna partición
; etiquetada "littlefs" (la suya es "ffat", de tipo FAT), así que
; `LittleFS.begin(..., "littlefs")` fallaba y el nodo arrancaba en bucle.
board_build.partitions = partitions_thermotrace.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; ===================== Filesystem =====================
; Los certificados TLS van en data/certs/ -> se flashean a LittleFS
board_build.filesystem = littlefs

; =========================================================================
; Pruebas unitarias en el host — `pio test -e native`
; =========================================================================
; `test_build_src = yes` junto con `build_src_filter` compila SOLO `src/core/`,
; que es la parte del firmware libre de Arduino. Si alguien mete una dependencia
; del SDK dentro de `core/`, este entorno deja de compilar: es justo la barrera
; que se quiere.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
