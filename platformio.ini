[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ===================== Librerías =====================
; ArduinoJson v7 — serialización del payload JSON
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit SHT31 Library @ ^2.2.0
    adafruit/Adafruit BusIO @ ^1.14.0
    milesburton/DallasTemperature @ ^3.11.0
    paulstoffregen/OneWire @ ^2.3.7
    knolleary/PubSubClient @ ^2.8

; ===================== Flags de compilación =====================
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DARDUINOJSON_USE_DOUBLE=1
    -DARDUINOJSON_ENABLE_STD_STRING=1

; ===================== Particiones =====================
; 4MB Flash: 1.2MB app0, 1.2MB app1 (OTA), 1.5MB LittleFS, 64KB NVS
board_build.partitions = default_ffat.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; ===================== Filesystem =====================
; Los certificados TLS van en data/certs/ -> se flashean a LittleFS
board_build.filesystem = littlefs
